<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090614"/>
      <stop offset="50%" stop-color="#160D2E"/>
      <stop offset="100%" stop-color="#040A18"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="50%" stop-color="#FFBE0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#A855F7" stroke-width="4"/>

  <!-- Glowing Outer Neon Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#hGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Stylized Wheel Segments -->
  <g transform="translate(256, 256)">
    <!-- 8 Sectors -->
    <path d="M 0 0 L 0 -210 A 210 210 0 0 1 148.5 -148.5 Z" fill="#E11D48" opacity="0.9"/>
    <path d="M 0 0 L 148.5 -148.5 A 210 210 0 0 1 210 0 Z" fill="#7C3AED" opacity="0.9"/>
    <path d="M 0 0 L 210 0 A 210 210 0 0 1 148.5 148.5 Z" fill="#0284C7" opacity="0.9"/>
    <path d="M 0 0 L 148.5 148.5 A 210 210 0 0 1 0 210 Z" fill="#9333EA" opacity="0.9"/>
    <path d="M 0 0 L 0 210 A 210 210 0 0 1 -148.5 148.5 Z" fill="#059669" opacity="0.9"/>
    <path d="M 0 0 L -148.5 148.5 A 210 210 0 0 1 -210 0 Z" fill="#D97706" opacity="0.9"/>
    <path d="M 0 0 L -210 0 A 210 210 0 0 1 -148.5 -148.5 Z" fill="#64748B" opacity="0.9"/>
    <path d="M 0 0 L -148.5 -148.5 A 210 210 0 0 1 0 -210 Z" fill="#DB2777" opacity="0.9"/>

    <!-- Perimeter Studs -->
    <circle cx="0" cy="-218" r="5" fill="#FFBE0B"/>
    <circle cx="154" cy="-154" r="5" fill="#00DFD8"/>
    <circle cx="218" cy="0" r="5" fill="#FFBE0B"/>
    <circle cx="154" cy="154" r="5" fill="#00DFD8"/>
    <circle cx="0" cy="218" r="5" fill="#FFBE0B"/>
    <circle cx="-154" cy="154" r="5" fill="#00DFD8"/>
    <circle cx="-218" cy="0" r="5" fill="#FFBE0B"/>
    <circle cx="-154" cy="-154" r="5" fill="#00DFD8"/>

    <!-- Central Glowing Hub -->
    <circle cx="0" cy="0" r="82" fill="#0E0924" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="0" cy="0" r="70" fill="#171136"/>

    <!-- Distinctive Stylized H Logo -->
    <path d="M -34 -44 L -14 -44 L -14 -12 L 14 -12 L 14 -44 L 34 -44 L 34 44 L 14 44 L 14 12 L -14 12 L -14 44 L -34 44 Z"
          fill="url(#hGrad)" filter="url(#glow)"/>

    <!-- Top Golden Pointer Needle -->
    <polygon points="0,-200 -18,-244 18,-244" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-238" r="4" fill="#090614"/>
  </g>
</svg>
